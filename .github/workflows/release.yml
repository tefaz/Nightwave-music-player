name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install AppImage runtime
        run: sudo apt-get update && sudo apt-get install --yes libfuse2

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Nightwave $GITHUB_REF_NAME" \
            --generate-notes \
            "dist/Nightwave-${GITHUB_REF_NAME#v}.AppImage" \
            "dist/nightwave-music-player_${GITHUB_REF_NAME#v}_amd64.deb"
